name: Daily & Weekly Stock Data Auto Update

on:
  schedule:
    # Run daily at 15:00 UTC (which is 23:00 Taiwan time)
    # This automatically updates the Daily Macro Compass, and the Weekly Chip Radar on Fridays/Saturdays.
    - cron: '0 15 * * *'
  workflow_dispatch: # Allows you to trigger this update manually from the GitHub Actions tab

permissions:
  contents: write # Grants write permissions to commit updated JSON/CSV files back to the repository

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Market Compass Update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python market_compass_robot.py

      - name: Run Chip Horse Update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python chip_horse_robot.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Add all files in data/ directory
          git add data/
          git commit -m "Auto-update stock data and reports [skip ci]" || echo "No changes to commit"
          git push
