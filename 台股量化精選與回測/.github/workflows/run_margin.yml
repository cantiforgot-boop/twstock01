name: Taiwan Stock Margin Diagnostics & Update

on:
  schedule:
    # 每個台股交易日 (週一至週五) 台灣時間 21:45 (UTC 13:45) 執行
    - cron: '45 13 * * 1-5'
  workflow_dispatch: # 允許手動從 GitHub 網頁觸發執行

jobs:
  run-margin-strategy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予 GitHub Actions 推送資料回儲存庫的權限

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 快取 pip 依賴，加快後續執行速度

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Margin Diagnostics (margin_t1_runner.py)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 執行籌碼診斷 (預設過濾 1000 張)
          python margin_t1_runner.py 1000

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update margin diagnostic data and indexes: $(date +'%Y-%m-%d')" || exit 0
          git push
